name: Release firmado (opcional)

# Solo manual. Requiere 4 secretos en: Settings > Secrets and variables > Actions
#   MARGEN_KEYSTORE_BASE64, MARGEN_KEYSTORE_PASSWORD,
#   MARGEN_KEY_ALIAS, MARGEN_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MARGEN_KEYSTORE_PASSWORD: ${{ secrets.MARGEN_KEYSTORE_PASSWORD }}
      MARGEN_KEY_ALIAS: ${{ secrets.MARGEN_KEY_ALIAS }}
      MARGEN_KEY_PASSWORD: ${{ secrets.MARGEN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.MARGEN_KEYSTORE_BASE64 }}
        run: |
          for v in KEYSTORE_B64 MARGEN_KEYSTORE_PASSWORD MARGEN_KEY_ALIAS MARGEN_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Falta el secreto: $v"
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/margen-release.jks"
          echo "MARGEN_KEYSTORE_PATH=$RUNNER_TEMP/margen-release.jks" >> "$GITHUB_ENV"

      - name: Compilar release firmado
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Publicar APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: margen-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
