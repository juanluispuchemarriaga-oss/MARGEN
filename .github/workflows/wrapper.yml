name: Generar Gradle Wrapper (una sola vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar wrapper oficial en carpeta temporal
        run: |
          mkdir "$RUNNER_TEMP/w"
          cd "$RUNNER_TEMP/w"
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/"

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Agregar Gradle Wrapper 8.9"
          git push
